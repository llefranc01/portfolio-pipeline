name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/llefranc01/portfolio-pipeline

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  build-and-push-image:
    needs: test-and-build
    runs-on: ubuntu-latest
    # Only pushes to the two long-lived branches publish an image.
    # PR runs have a refs/pull/... ref, so they never match.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME}"
          {
            echo "image=${IMAGE_NAME}:${branch}-${short_sha}"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${branch}"
            echo "${IMAGE_NAME}:${branch}-${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: [test-and-build, build-and-push-image]
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
      - name: Simulate staging deploy
        run: echo "Deploying ${{ needs.build-and-push-image.outputs.image }} to staging environment..."

  deploy-production:
    needs: [test-and-build, build-and-push-image]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
      - name: Simulate production deploy
        run: echo "Deploying ${{ needs.build-and-push-image.outputs.image }} to production environment..."
